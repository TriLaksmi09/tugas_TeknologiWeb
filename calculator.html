<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator - Laksmi Antari</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body>

    <header class="px-6 py-6 md:px-12 lg:px-20">
    <nav class="mx-auto flex max-w-7xl items-center justify-between">

        <a href="index.html" class="text-xl font-bold tracking-tight">
            LAKSMI<span class="text-[#7CC4ED]">.</span>
        </a>

        <div class="hidden items-center gap-8 text-sm md:flex">

            <a href="index.html" class="transition hover:text-[#3B82B6]">
                Beranda
            </a>

            <a href="about.html" class="transition hover:text-[#3B82B6]">
                Tentang Saya
            </a>

            <a href="projects.html" class="font-medium text-[#3B82B6]">
                Proyek
            </a>

            <a href="contact.html" class="transition hover:text-[#3B82B6]">
                Kontak
            </a>

        </div>

        <a href="contact.html"
           class="hidden rounded-full bg-[#A9D8F5] px-5 py-2.5 text-sm font-medium text-[#1F4E6B] transition hover:bg-[#8DCCED] md:block">
            Mari Terhubung →
        </a>


    </nav>
</header>

    <main class="calculator-page">

        <div class="calculator-title">

            <p>PROYEK JAVASCRIPT</p>

            <h1>Kalkulator</h1>

        </div>


        <div class="calculator">

            <div class="calculator-display">

                <div id="display">0</div>

            </div>

            <div class="calculator-buttons">

                <button
                    id="clear"
                    class="function-button"
                    type="button">
                    C
                </button>

                <button
                    id="delete"
                    class="function-button"
                    type="button">
                    ⌫
                </button>

                <button
                    class="function-button"
                    data-value="("
                    type="button">
                    (
                </button>

                <button
                    class="operator-button"
                    data-value="÷"
                    type="button">
                    ÷
                </button>


                <button
                    class="number-button"
                    data-value="7"
                    type="button">
                    7
                </button>

                <button
                    class="number-button"
                    data-value="8"
                    type="button">
                    8
                </button>

                <button
                    class="number-button"
                    data-value="9"
                    type="button">
                    9
                </button>

                <button
                    class="operator-button"
                    data-value="×"
                    type="button">
                    ×
                </button>


                <button
                    class="number-button"
                    data-value="4"
                    type="button">
                    4
                </button>

                <button
                    class="number-button"
                    data-value="5"
                    type="button">
                    5
                </button>

                <button
                    class="number-button"
                    data-value="6"
                    type="button">
                    6
                </button>

                <button
                    class="operator-button"
                    data-value="−"
                    type="button">
                    −
                </button>


                <button
                    class="number-button"
                    data-value="1"
                    type="button">
                    1
                </button>

                <button
                    class="number-button"
                    data-value="2"
                    type="button">
                    2
                </button>

                <button
                    class="number-button"
                    data-value="3"
                    type="button">
                    3
                </button>

                <button
                    class="operator-button"
                    data-value="+"
                    type="button">
                    +
                </button>

                <button
                    class="number-button zero-button"
                    data-value="0"
                    type="button">
                    0
                </button>

                <button
                    class="number-button"
                    data-value="."
                    type="button">
                    .
                </button>

                <button
                    id="equals"
                    class="equals-button"
                    type="button">
                    =
                </button>

            </div>

        </div>


        <div class="page-navigation">

            <a href="projects.html" class="back-button">
                ← Kembali ke Proyek
            </a>

            <a href="contact.html" class="next-button">
                Hubungi Saya →
            </a>

        </div>

    </main>


    <footer class="footer">

        <p>
            © 2026 Laksmi Antari.
        </p>

    </footer>

    <script src="./js/calculator.js"></script>

</body>

</html>
